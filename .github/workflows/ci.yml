name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Fetch eval corpus (pinned, checksummed)
        run: python -m eval.fetch_corpus
      - name: Tests
        run: pytest
      - name: Retrieval quality gate (BM25, no API key needed)
        run: python -m eval.run retrieval --offline --configs bm25 --min-hit-rate 0.80
      - name: Eval harness smoke test (offline models)
        run: python -m eval.run all --offline --configs hybrid full --limit 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: backend/eval/reports/runs/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
